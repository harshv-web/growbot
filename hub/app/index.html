<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeevo">
<title>Jeevo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="rail" id="rail" aria-label="Screens"></nav>
<main id="main">
  <section id="s-jeevo" class="screen face-screen" data-title="Jeevo">
    <canvas id="face" aria-label="Jeevo's face"></canvas>
    <div class="face-line" id="faceLine" role="status">Hi.</div>
  </section>
  <section id="s-today" class="screen" data-title="Today"></section>
  <section id="s-ride" class="screen" data-title="Ride"></section>
  <section id="s-life" class="screen" data-title="Life"></section>
  <section id="s-inbox" class="screen" data-title="Inbox"></section>
  <section id="s-memory" class="screen" data-title="Memory"></section>
  <section id="s-crew" class="screen" data-title="Crew"></section>
  <section id="s-settings" class="screen" data-title="Settings"></section>
</main>
<header class="top" id="top"><b>JEEVO</b><span id="mood">Content</span><span class="dot" id="conn" title="Connected to the hub"></span></header>
<div class="ask" id="ask">
  <form id="askForm" autocomplete="off"><input id="askInput" placeholder="Ask, tell, or remind…" aria-label="Ask Jeevo"><button type="button" class="mic" id="mic" aria-label="Talk">●</button></form>
  <div class="answer" id="answer" hidden></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="../face/face.js"></script>
<script src="app.js"></script>
</body>
</html>
